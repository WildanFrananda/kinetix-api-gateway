version: '3.8'

services:
  gateway:
    build: .
    container_name: kinetix_api_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - IDENTITY_SERVICE_URL=http://kinetix-identity-service:5000
      - CATALOG_SERVICE_URL=http://kinetix-catalog-service:8000
      - WAREHOUSE_SERVICE_URL=http://kinetix-warehouse-service:3000
      - MATCHING_SERVICE_URL=http://kinetix-matching-service:4000
