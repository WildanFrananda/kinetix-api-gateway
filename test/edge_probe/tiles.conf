include /usr/local/kong/kinetix/access_log.conf;

server {
    listen 127.0.0.1:8090;
    root /srv;
    access_log off;

    location /tiles/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Echo-Host $http_host always;
        add_header X-Echo-Port $http_x_forwarded_port always;
        add_header X-Echo-Range $http_range always;
        add_header X-Echo-If-None-Match $http_if_none_match always;
        add_header X-Echo-If-Range $http_if_range always;
        add_header X-Echo-Etag $sent_http_etag always;
    }
}
