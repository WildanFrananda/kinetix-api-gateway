worker_processes 1;
pid /tmp/openresty.pid;

events {
  worker_connections 1024;
}

http {
  include /usr/local/openresty/nginx/conf/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 5000;
    listen 8000;
    listen 8088;
    listen 3000;
    listen 4000;
    listen 6000;
    listen 8001;
    listen 8002;
    listen 8003;
    listen 8010;
    listen 8004;
    listen 8012;
    listen 9000;
    listen 8080;

    location ~ ^/tiles/ {
      proxy_pass http://127.0.0.1:8090;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
      content_by_lua_block {
        local cjson = require "cjson.safe"
        local raw_headers = ngx.req.get_headers(0, true)
        local headers = setmetatable({}, cjson.empty_object_mt)
        for k, v in pairs(raw_headers) do
          headers[string.lower(k)] = type(v) == "table" and table.concat(v, ", ") or v
        end
        local args = ngx.req.get_uri_args()
        local query = setmetatable({}, cjson.empty_object_mt)
        for k, v in pairs(args) do
          query[k] = v
        end
        ngx.status = 200
        ngx.header["Content-Type"] = "application/json"
        ngx.say(cjson.encode({
          request = {
            port = tonumber(ngx.var.server_port),
            method = ngx.req.get_method(),
            path = ngx.var.uri,
            query = query,
            headers = headers,
          }
        }))
      }
    }
  }

  server {
    listen 127.0.0.1:8090;
    root /srv;

    location /tiles/ {
      add_header Cache-Control "no-cache" always;
      add_header X-Echo-Host $http_host always;
      add_header X-Echo-Port $http_x_forwarded_port always;
      add_header X-Echo-Range $http_range always;
      add_header X-Echo-If-None-Match $http_if_none_match always;
      add_header X-Echo-If-Range $http_if_range always;
      add_header X-Echo-Etag $sent_http_etag always;
    }
  }
}
