_format_version: "3.0"
services:
  - name: echo
    url: http://127.0.0.1:9
    routes:
      - name: echo
        paths:
          - /
        plugins:
          - name: request-termination
            config:
              status_code: 200
              echo: true
  - name: tiles
    url: http://127.0.0.1:8090
    routes:
      - name: tiles
        paths:
          - /tiles/
        strip_path: false
        preserve_host: true
