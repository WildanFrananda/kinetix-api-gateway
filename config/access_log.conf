map $request_uri $kinetix_request_path {
    "~^([^?]*)" $1;
}

log_format kinetix
    '$remote_addr [$time_local] "$request_method $kinetix_request_path $server_protocol" '
    '$status $body_bytes_sent "$http_user_agent" '
    'request_id: "$http_x_request_id" kong_request_id: "$kong_request_id"';
