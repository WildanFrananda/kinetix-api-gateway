worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    # Dynamic Resolver for Docker DNS
    resolver 127.0.0.11 8.8.8.8 ipv6=off valid=10s;

    # C-Level Memory-Leak Free Rate Limiting (100 req/min per IP)
    limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=100r/m;
    limit_req_status 429;

    server {
        listen 8080;
        server_name localhost;

        # Directives for buffering and timeout real-time
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # ----------------------------------------------------
        # 1. HEALTH CHECK (Public)
        # ----------------------------------------------------
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"kinetix-api-gateway","engine":"OpenResty/NGINX","mode":"production","port":8080}';
        }

        # ----------------------------------------------------
        # 2. AUTH & IDENTITY SERVICE ROUTE (:5000)
        # ----------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=api_gateway_limit burst=10 nodelay;
            header_filter_by_lua_file /usr/local/openresty/nginx/lua/cors.lua;

            # Rewrite /api/v1/auth/login -> /api/auth/login
            rewrite ^/api/v1/auth/(.*) /api/auth/$1 break;
            set $identity_service "http://kinetix-identity-service:5000";
            proxy_pass $identity_service;
        }

        # Subrequest Internal for JWT Token Validation
        location = /_validate_jwt {
            internal;
            proxy_method POST;
            proxy_set_header Content-Type "application/json";
            set $identity_validate "http://kinetix-identity-service:5000/api/auth/validate";
            proxy_pass $identity_validate;
        }

        # ----------------------------------------------------
        # 3. CATALOG SERVICE ROUTE (:8000)
        # ----------------------------------------------------
        location ~ ^/api/v1/(products|cart|checkout|categories|brands) {
            limit_req zone=api_gateway_limit burst=20 nodelay;
            header_filter_by_lua_file /usr/local/openresty/nginx/lua/cors.lua;

            # Rewrite /api/v1/products -> /api/products
            rewrite ^/api/v1/(.*) /api/$1 break;
            set $catalog_service "http://kinetix-catalog-service:8000";
            proxy_pass $catalog_service;
        }

        # ----------------------------------------------------
        # 4. WAREHOUSE OMS SERVICE ROUTE (:3000)
        # ----------------------------------------------------
        location /api/v1/warehouse/ {
            limit_req zone=api_gateway_limit burst=20 nodelay;
            header_filter_by_lua_file /usr/local/openresty/nginx/lua/cors.lua;

            # JWT Auth Guard via Lua
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_guard.lua;

            # Rewrite /api/v1/warehouse/inventory -> /api/v1/inventory
            rewrite ^/api/v1/warehouse/(.*) /api/v1/$1 break;
            set $warehouse_service "http://kinetix-warehouse-service:3000";
            proxy_pass $warehouse_service;
        }

        # ----------------------------------------------------
        # 5. MATCHING SERVICE REST ROUTE (:4000)
        # ----------------------------------------------------
        location /api/v1/matching/ {
            limit_req zone=api_gateway_limit burst=20 nodelay;
            header_filter_by_lua_file /usr/local/openresty/nginx/lua/cors.lua;

            # JWT Auth Guard via Lua
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_guard.lua;

            rewrite ^/api/v1/matching/(.*) /api/v1/$1 break;
            set $matching_service "http://kinetix-matching-service:4000";
            proxy_pass $matching_service;
        }

        # ----------------------------------------------------
        # 6. WEBSOCKET REAL-TIME PROXY (:4000) [Flutter Courier]
        # ----------------------------------------------------
        location /ws/v1/matching/socket {
            set $matching_ws "http://kinetix-matching-service:4000/socket/websocket";
            proxy_pass $matching_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket/websocket {
            set $matching_ws "http://kinetix-matching-service:4000/socket/websocket";
            proxy_pass $matching_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------
        # 7. SSE TELEMETRY STREAMING PROXY (:4000)
        # ----------------------------------------------------
        location /api/v1/matching/telemetry/stream {
            set $matching_sse "http://kinetix-matching-service:4000/api/v1/telemetry/stream";
            proxy_pass $matching_sse;

            # Non-buffering mandatory for SSE Event Stream
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
        }
    }
}
