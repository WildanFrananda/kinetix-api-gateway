name: CI

# The gateway's config is generated from Apple Pkl, so three things break independently: the
# Pkl evaluates but produces invalid Kong config; the Kong config is valid but routes to
# hostnames nothing answers to; the routes resolve but rewrite the path into a 404. Separate
# jobs, so a red build says which.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  config-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pkl
        run: |
          curl -sSL -o /usr/local/bin/pkl \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64
          chmod +x /usr/local/bin/pkl
          pkl --version

      - name: Install deck
        run: |
          # The API response goes to a file before it is parsed. `curl | grep -m1` makes grep
          # exit at the first match, closing the pipe and failing curl with exit 23 — a
          # download that succeeded, reported as an error, and fatal under pipefail.
          curl -fsSL -o /tmp/deck-release.json https://api.github.com/repos/Kong/deck/releases/latest
          version="$(grep -m1 '"tag_name"' /tmp/deck-release.json | cut -d'"' -f4 | sed 's/^v//')"
          test -n "$version" || { echo "could not resolve the latest deck release"; exit 1; }
          echo "installing deck $version"
          # Downloaded to a file, then extracted — not piped. `curl | tar` makes tar close the
          # pipe once it has the one file it wants, curl fails its write with exit 23, and the
          # shell's pipefail turns a download that actually worked into a failed step.
          curl -fsSL -o /tmp/deck.tgz \
            "https://github.com/Kong/deck/releases/download/v${version}/deck_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/deck.tgz -C /tmp deck
          sudo mv /tmp/deck /usr/local/bin/
          deck version

      # The container renders this config at start from its environment's key, issuer and origins. CI
      # supplies throwaway ones: a key pair generated here and discarded, names that resolve nowhere.
      - name: Evaluate the Pkl config
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/throwaway.pem 2>/dev/null
          openssl pkey -in /tmp/throwaway.pem -pubout -out /tmp/throwaway-public.pem
          render() {
            pkl eval -p identityJwtPublicKey="$(cat /tmp/throwaway-public.pem)" \
                     -p jwtIssuer=https://identity.ci.invalid -p corsOrigins="$1" \
                     -p staffRanges=192.0.2.0/24 -p publicApiHost=api.ci.invalid \
                     -p backofficeHost=backoffice.ci.invalid:8443 -p sellerHost=seller.ci.invalid \
                     -f yaml config/gateway.pkl -o "$2"
          }
          # Same, with the object store's hostname supplied. Kept as a separate function rather
          # than a fifth argument to render(), so the calls above keep reading as what they are.
          render_with_storage() {
            pkl eval -p identityJwtPublicKey="$(cat /tmp/throwaway-public.pem)" \
                     -p jwtIssuer=https://identity.ci.invalid -p corsOrigins="" \
                     -p staffRanges=192.0.2.0/24 -p publicApiHost=api.ci.invalid \
                     -p backofficeHost=backoffice.ci.invalid:8443 -p sellerHost=seller.ci.invalid \
                     -p storageHost="$1" -f yaml config/gateway.pkl -o "$2"
          }
          render "https://app.ci.invalid" kong.yml
          render "" kong-no-cors.yml
          # No browser origins must mean no cors plugin: Kong's cors plugin with no origins answers `*`.
          if grep -q 'name: cors' kong-no-cors.yml; then
            echo "an empty origin list still rendered the cors plugin"; exit 1
          fi
          # `*` beside a named origin is a contradiction, and must not evaluate.
          if render "*,https://app.ci.invalid" /tmp/contradiction.yml 2>/dev/null; then
            echo "'*' combined with another origin was accepted"; exit 1
          fi
          # Object storage is optional and its route is gated on a hostname. Both directions are
          # asserted because each failure is silent in its own way: a route that never renders is
          # a feature that quietly does not exist, and one that renders without a host is a Kong
          # route matching every request that reaches it.
          render_with_storage "storage.ci.invalid" kong-storage.yml
          if ! grep -q 'storage.ci.invalid' kong-storage.yml; then
            echo "a storage host was given and no route was rendered for it"; exit 1
          fi
          # A presigned URL is signed over the Host header the phone sends. Kong replaces it with the
          # upstream's unless told to keep it, and the object store then refuses every upload as a bad signature.
          if ! grep -q 'preserve_host: true' kong-storage.yml; then
            echo "the storage route does not keep the Host header a presigned URL was signed for"; exit 1
          fi
          render_with_storage "" kong-no-storage.yml
          if grep -q 'name: storage-service' kong-no-storage.yml; then
            echo "no storage host was given and a storage route was rendered anyway"; exit 1
          fi
          # And with the property absent entirely, which is how every caller that does not care
          # about object storage invokes this — including the two renders above. A required
          # property for an optional feature makes their business fail, which is exactly how this
          # job went red on 2026-09-18.
          pkl eval -p identityJwtPublicKey="$(cat /tmp/throwaway-public.pem)" \
                   -p jwtIssuer=https://identity.ci.invalid -p corsOrigins="" \
                   -p staffRanges=192.0.2.0/24 -p publicApiHost=api.ci.invalid \
                   -p backofficeHost=backoffice.ci.invalid:8443 -p sellerHost=seller.ci.invalid \
                   -f yaml config/gateway.pkl -o /tmp/kong-absent.yml
          echo "config renders with origins, without them, refuses a contradiction, and gates storage on its host"

      - name: The staff gate and the edge answers
        run: |
          gate() {
            pkl eval -p identityJwtPublicKey="$(cat /tmp/throwaway-public.pem)" \
                     -p jwtIssuer=https://identity.ci.invalid -p corsOrigins= \
                     -p publicApiHost=api.ci.invalid -p backofficeHost=backoffice.ci.invalid:8443 \
                     -p sellerHost=seller.ci.invalid "$@" \
                     -f yaml config/gateway.pkl -o /tmp/kong-gate.yml 2>/dev/null
          }
          if gate; then
            echo "the config rendered without a staff range"; exit 1
          fi
          for range in "" "0.0.0.0/0" "::/0" "not-an-address"; do
            if gate -p staffRanges="$range"; then
              echo "the staff range '$range' was accepted"; exit 1
            fi
          done
          gates="$(grep -c 'name: ip-restriction' kong.yml)"
          if [ "$gates" != 9 ]; then
            echo "expected the staff gate on 9 routes, found $gates"; exit 1
          fi
          if ! grep -qF "body: '{\"status\":\"ok\"}'" kong.yml; then
            echo "/health answers more than its status"; exit 1
          fi
          if ! grep -qF 'Canonical: https://api.ci.invalid/.well-known/security.txt' kong.yml; then
            echo "security.txt does not name the host it is served from"; exit 1
          fi
          echo "the staff gate needs a range, refuses an everyone range and covers 9 routes; /health and security.txt are as published"

      - name: The browser-app hosts and the internal twins
        run: |
          hosts() {
            pkl eval -p identityJwtPublicKey="$(cat /tmp/throwaway-public.pem)" \
                     -p jwtIssuer=https://identity.ci.invalid -p corsOrigins= \
                     -p staffRanges=192.0.2.0/24 -p publicApiHost=api.ci.invalid "$@" \
                     -f yaml config/gateway.pkl -o /tmp/kong-hosts.yml 2>/dev/null
          }
          if hosts -p sellerHost=seller.ci.invalid; then
            echo "the config rendered without a backoffice host"; exit 1
          fi
          if hosts -p backofficeHost=backoffice.ci.invalid; then
            echo "the config rendered without a seller host"; exit 1
          fi
          for pair in "api.ci.invalid:8443 seller.ci.invalid" "backoffice.ci.invalid seller.ci.invalid:443" \
                      "backoffice.ci.invalid backoffice.ci.invalid" "kinetix-api-gateway seller.ci.invalid"; do
            set -- $pair
            if hosts -p backofficeHost="$1" -p sellerHost="$2"; then
              echo "the browser-app hosts '$1' and '$2' were accepted"; exit 1
            fi
          done
          pkl eval -p identityJwtPublicKey="$(cat /tmp/throwaway-public.pem)" \
                   -p jwtIssuer=https://identity.ci.invalid -p corsOrigins="https://app.ci.invalid" \
                   -p staffRanges=192.0.2.0/24 -p publicApiHost=api.ci.invalid \
                   -p backofficeHost=backoffice.ci.invalid:8443 -p sellerHost=seller.ci.invalid \
                   -p storageHost=storage.ci.invalid -f json config/gateway.pkl -o /tmp/kong.json
          broken="$(jq -r --arg backoffice backoffice.ci.invalid --arg seller seller.ci.invalid \
                         -f test/config_invariants.jq /tmp/kong.json)"
          if [ -n "$broken" ]; then
            printf '%s\n' "$broken"; exit 1
          fi
          echo "/bff/ on the two browser-app hosts goes to the edge and nothing else does; every API route has its plaintext twin"

      - name: Kong must accept it
        run: |
          deck file validate kong.yml
          deck file validate kong-no-cors.yml
          deck file validate kong-storage.yml
          deck file validate /tmp/kong.json

      # Every upstream has to be a compose service name. A localhost or host.docker.internal
      # address routes to the gateway container itself, which is how a config can look correct
      # and reach nothing.
      - name: No upstream may point outside the network
        run: |
          if grep -nE 'url: https?://(localhost|host\.docker\.internal|127\.0\.0\.1)' kong.yml \
             | grep -v '127.0.0.1:8443/health'; then
            echo "an upstream points outside the compose network"
            exit 1
          fi
          echo "every upstream is a service name"

      - uses: actions/upload-artifact@v7
        with:
          name: kong-config
          path: kong.yml
          retention-days: 7

  build-image:
    runs-on: ubuntu-latest
    needs: config-valid
    steps:
      - uses: actions/checkout@v6

      - name: A .dockerignore must exist
        run: test -f .dockerignore || { echo "no .dockerignore — the context would carry .env and .git"; exit 1; }

      - name: Build
        run: docker build -t kinetix-api-gateway:ci .

      - name: Edge probe
        run: bash test/edge_probe.sh kinetix-api-gateway:ci

      - name: Nothing excluded may be in the image
        run: |
          # `|| true` is load-bearing: grep exits 1 when it matches nothing, and the shell
          # runs with -e, so a CLEAN image would fail this step silently.
          listing="$(docker run --rm --entrypoint sh kinetix-api-gateway:ci -c 'ls -a . / 2>/dev/null' || true)"
          found="$(printf '%s\n' "$listing" | grep -E '^\.(git|env)$' | sort -u || true)"
          if [ -n "$found" ]; then
            echo "these must not be in the image:"
            printf '  %s\n' $found
            exit 1
          fi
          echo "no .git and no .env in the image"

      # An empty or root USER is a failure, not a warning: this is the only container the
      # platform publishes to the host.
      - name: The image must not run as root
        run: |
          user="$(docker image inspect -f '{{json .Config.User}}' kinetix-api-gateway:ci | tr -d '"')"
          case "$user" in
            ""|"0"|"root"|"0:0") echo "image runs as root (USER='$user')"; exit 1 ;;
            *) echo "image runs as '$user'" ;;
          esac
