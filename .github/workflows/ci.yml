name: CI

# The gateway's config is generated from Apple Pkl, so three things break independently: the
# Pkl evaluates but produces invalid Kong config; the Kong config is valid but routes to
# hostnames nothing answers to; the routes resolve but rewrite the path into a 404. Separate
# jobs, so a red build says which.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  config-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pkl
        run: |
          curl -sSL -o /usr/local/bin/pkl \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64
          chmod +x /usr/local/bin/pkl
          pkl --version

      - name: Install deck
        run: |
          # The API response goes to a file before it is parsed. `curl | grep -m1` makes grep
          # exit at the first match, closing the pipe and failing curl with exit 23 — a
          # download that succeeded, reported as an error, and fatal under pipefail.
          curl -fsSL -o /tmp/deck-release.json https://api.github.com/repos/Kong/deck/releases/latest
          version="$(grep -m1 '"tag_name"' /tmp/deck-release.json | cut -d'"' -f4 | sed 's/^v//')"
          test -n "$version" || { echo "could not resolve the latest deck release"; exit 1; }
          echo "installing deck $version"
          # Downloaded to a file, then extracted — not piped. `curl | tar` makes tar close the
          # pipe once it has the one file it wants, curl fails its write with exit 23, and the
          # shell's pipefail turns a download that actually worked into a failed step.
          curl -fsSL -o /tmp/deck.tgz \
            "https://github.com/Kong/deck/releases/download/v${version}/deck_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/deck.tgz -C /tmp deck
          sudo mv /tmp/deck /usr/local/bin/
          deck version

      - name: Evaluate the Pkl config
        run: pkl eval -f yaml config/gateway.pkl -o kong.yml

      - name: Kong must accept it
        run: deck file validate kong.yml

      # Every upstream has to be a compose service name. A localhost or host.docker.internal
      # address routes to the gateway container itself, which is how a config can look correct
      # and reach nothing.
      - name: No upstream may point outside the network
        run: |
          if grep -nE 'url: https?://(localhost|host\.docker\.internal|127\.0\.0\.1)' kong.yml \
             | grep -v '127.0.0.1:8443/health'; then
            echo "an upstream points outside the compose network"
            exit 1
          fi
          echo "every upstream is a service name"

      - uses: actions/upload-artifact@v4
        with:
          name: kong-config
          path: kong.yml
          retention-days: 7

  build-image:
    runs-on: ubuntu-latest
    needs: config-valid
    steps:
      - uses: actions/checkout@v6

      - name: A .dockerignore must exist
        run: test -f .dockerignore || { echo "no .dockerignore — the context would carry .env and .git"; exit 1; }

      - name: Build
        run: docker build -t kinetix-api-gateway:ci .

      - name: Nothing excluded may be in the image
        run: |
          # `|| true` is load-bearing: grep exits 1 when it matches nothing, and the shell
          # runs with -e, so a CLEAN image would fail this step silently.
          listing="$(docker run --rm --entrypoint sh kinetix-api-gateway:ci -c 'ls -a . / 2>/dev/null' || true)"
          found="$(printf '%s\n' "$listing" | grep -E '^\.(git|env)$' | sort -u || true)"
          if [ -n "$found" ]; then
            echo "these must not be in the image:"
            printf '  %s\n' $found
            exit 1
          fi
          echo "no .git and no .env in the image"

      # An empty or root USER is a failure, not a warning: this is the only container the
      # platform publishes to the host.
      - name: The image must not run as root
        run: |
          user="$(docker image inspect -f '{{json .Config.User}}' kinetix-api-gateway:ci | tr -d '"')"
          case "$user" in
            ""|"0"|"root"|"0:0") echo "image runs as root (USER='$user')"; exit 1 ;;
            *) echo "image runs as '$user'" ;;
          esac
