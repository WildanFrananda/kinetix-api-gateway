# Kinetix API gateway CI — GitLab.
#
# ⚠ PAIRED FILE: .github/workflows/ci.yml
# `origin` is GitHub and GitLab is a mirror. Both assert the same things and must be changed
# together; if they drift, the two platforms disagree about whether the same commit is good.

include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

secret-scan:
  extends: .secret-scan

# ── 1. The Pkl evaluates and Envoy accepts the result ────────────────────────────────

envoy-valid:
  stage: verify
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache bash curl jq openssl
    - |
      case "$(uname -m)" in
        aarch64|arm64) PKL_ARCH=linux-aarch64 ;;
        *)             PKL_ARCH=linux-amd64 ;;
      esac
      curl -fsSL -o /usr/local/bin/pkl "https://github.com/apple/pkl/releases/download/0.32.1/pkl-${PKL_ARCH}"
      chmod +x /usr/local/bin/pkl
      pkl --version
  script:
    - bash test/validate_envoy.sh
    - bash test/conformance_envoy.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-image:
  extends: .build-image
  needs: [envoy-valid]
