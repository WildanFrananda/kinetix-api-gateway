# gitleaks configuration for kinetix-api-gateway.
#
# gitleaks picks this up automatically from the repository root, so both the CI job and a local
# `gitleaks detect` use the same rules. Every entry below has to justify itself: an allowlist
# that is easier to extend than to argue with stops being a secret scanner.

[extend]
# Keep every default rule. This file only ever subtracts specific, argued exceptions.
useDefault = true

[[rules]]
# The default generic-api-key rule fires on any high-entropy string near a key-ish word, which
# is the right default and is why this one exception exists rather than a weaker rule.
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  # Sec-WebSocket-Key is not a credential. RFC 6455 §4.1 defines it as a nonce the client
  # generates per connection so the server can prove it understood the handshake; it carries no
  # authentication or confidentiality, and the server echoes a derived value back in the clear.
  #
  # The specific value that triggered this — SGVsbG8sIHdvcmxkIQ== — is base64 for
  # "Hello, world!". It is a documentation example in README.md showing how to verify the
  # WebSocket upgrade with curl.
  #
  # Scoped to the header name, not to README.md and not to the value: a real credential written
  # on a Sec-WebSocket-Key line would still be wrong, but it would also be a stranger mistake
  # than this rule is meant to catch, and widening the exception to the whole file would hide
  # the next real finding in it.
  regexes = ['''Sec-WebSocket-Key:\s*[A-Za-z0-9+/=]+''']
  regexTarget = "line"
